# .github/workflows/release-trigger.yml
# En: Grupo-2-DPM/DeepSaffix-DESKTOP
# Propósito: Recibir el frontend, preparar dist, crear tag → dispara el build de Electron

name: Prepare Release

on:
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID del workflow de frontend (dejar vacío para usar el último)'
        required: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para push de tags

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Resuelve el run_id: desde el payload, input manual, o el último exitoso
      - name: Resolve Frontend Run ID
        id: resolve_run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTION_TOKEN }}
          script: |
            // Prioridad: payload > input manual > último exitoso
            let runId = context.payload.client_payload?.run_id
                     || context.payload.inputs?.run_id;

            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: 'Grupo-2-DPM',
                repo: 'DeepSaffix-WEB',
                workflow_id: 'main.yml',
                status: 'success',
                per_page: 1
              });
              runId = runs.data.workflow_runs[0]?.id;
              if (!runId) core.setFailed('No se encontró ningún run exitoso del frontend');
            }

            console.log(`Using frontend run_id: ${runId}`);
            core.setOutput('run_id', runId);

      - name: Download Frontend Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.ACTION_TOKEN }}
          workflow: main.yml
          run_id: ${{ steps.resolve_run.outputs.run_id }}
          name: frontend-dist
          repo: Grupo-2-DPM/DeepSaffix-WEB
          path: dist

      - name: Install Dependencies (solo para leer package.json)
        run: npm install --ignore-scripts

      # Calcula la versión incrementando el build number de forma determinista
      - name: Calculate Next Version
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          NEXT_BUILD=${{ github.run_number }}
          FINAL_VERSION="${BASE_VERSION}-build.${NEXT_BUILD}"
          
          echo "APP_VERSION=${FINAL_VERSION}" >> $GITHUB_ENV
          echo "version=${FINAL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${FINAL_VERSION}" >> $GITHUB_OUTPUT
          
          echo "▶ Versión calculada: ${FINAL_VERSION}"

      # Actualiza package.json con la nueva versión
      - name: Bump package.json Version
        run: npm version ${{ steps.versioning.outputs.version }} --no-git-tag-version

      # Commit del dist + package.json actualizado, luego crea el tag
      # El tag es lo que dispara el workflow de Electron
      - name: Commit dist & Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/ package.json package-lock.json -f

          # Solo hace commit si hay cambios reales
          if git diff --staged --quiet; then
            echo "ℹ Sin cambios en dist, solo se creará el tag"
          else
            git commit -m "chore(release): dist actualizado para ${{ steps.versioning.outputs.version }} [skip ci]"
            git push origin main
          fi

          # El tag es el "disparador oficial" del empaquetado de Electron
          git tag ${{ steps.versioning.outputs.tag }}
          git push origin ${{ steps.versioning.outputs.tag }}
          
          echo "✅ Tag ${{ steps.versioning.outputs.tag }} publicado → Electron build iniciará automáticamente"

      - name: Summary
        run: |
          echo "### 🚀 Release Preparado" >> $GITHUB_STEP_SUMMARY
          echo "- **Versión**: \`${{ steps.versioning.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.versioning.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Run ID**: \`${{ steps.resolve_run.outputs.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Siguiente paso**: Electron build se disparó automáticamente" >> $GITHUB_STEP_SUMMARY