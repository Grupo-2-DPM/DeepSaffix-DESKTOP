name: DeepSaffix Production Build

on:
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch: # Permite ejecutarlo a mano para probar

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Paso 1: Descargar el frontend actualizado
      - name: Download Frontend
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.ACTION_TOKEN }}
          workflow: main.yml
          run_id: ${{ github.event.client_payload.run_id }}
          name: frontend-dist
          repo: Grupo-2-DPM/DeepSaffix-WEB
          path: dist

      - name: Debug folder
        shell: bash
        run: ls -R dist # Verificamos que el dist descargado está ahí

      - name: Install Dependencies
        run: npm install

      - name: Set Version and Push Tag
        shell: bash
        env:
          # Usamos el token para tener permisos de escritura
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          # 1. Configurar Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Calcular nueva versión (Ej: 1.0.0-build.15)
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${PACKAGE_VERSION}-build.${{ github.run_number }}"
          
          # 3. Actualizar package.json y crear el TAG
          # El comando 'npm version' crea un commit y un tag automáticamente
          npm version $NEW_VERSION -m "Release version $NEW_VERSION [skip ci]"
          
          # 4. Push de los cambios y el tag
          # Usamos la URL con el token para asegurar permisos
          git push origin main --follow-tags
