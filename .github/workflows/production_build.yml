name: DeepSaffix Production Build

on:
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch:

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Usar el token aquí es lo que permite que el push dispare otros workflows
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Frontend
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.ACTION_TOKEN }}
          workflow: main.yml
          run_id: ${{ github.event.client_payload.run_id }}
          name: frontend-dist
          repo: Grupo-2-DPM/DeepSaffix-WEB
          path: dist

      - name: Install Dependencies
        run: npm install

      - name: Set Version and Push Tag
        shell: bash
        run: |
          # 1. Configurar Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Limpiar la versión para evitar el build.25-build.26
          # Extraemos solo X.Y.Z ignorando cualquier cosa después del guion
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          NEW_VERSION="v${BASE_VERSION}-build.${{ github.run_number }}"
          
          echo "Nueva versión calculada: $NEW_VERSION"

          # 3. Preparar archivos
          git add dist/ -f
          
          # 4. Actualizar package.json y crear commit/tag
          # --force para ignorar el directorio sucio
          npm version $NEW_VERSION -m "Release $NEW_VERSION [skip ci]" --force
          
          # 5. Push explícito de la rama y los tags
          # Usamos la sintaxis con el token en la URL para asegurar que GitHub lo reconozca como evento externo
          git push https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/${{ github.repository }}.git main --follow-tags