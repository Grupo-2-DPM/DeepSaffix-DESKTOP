name: DeepSaffix Full Production Release

on:
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch: # Para pruebas manuales

jobs:
  prepare-and-publish:
    # Ejecutamos la preparación en Ubuntu, y luego la matriz para compilar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Aquí definimos los dos sistemas operativos de una vez
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Descargar el frontend (Ambos runners lo necesitan para compilar)
      - name: Download Frontend
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.ACTION_TOKEN }}
          workflow: main.yml
          run_id: ${{ github.event.client_payload.run_id }}
          name: frontend-dist
          repo: Grupo-2-DPM/DeepSaffix-WEB
          path: dist

      - name: Install Dependencies
        run: npm install

      # 2. Sincronizar Versión (Limpia el build.X anterior y pone el nuevo)
      - name: Set Version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          FINAL_VERSION="${BASE_VERSION}-build.${{ github.run_number }}"
          echo "APP_VERSION=$FINAL_VERSION" >> $GITHUB_ENV
          npm version $FINAL_VERSION --no-git-tag-version

      # 3. Compilar (Electron Builder usará el 'dist' que descargamos)
      - name: Build and Publish
        run: |
          npm run compile
          npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'linux' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}

      # 4. Solo el runner de Ubuntu se encarga de subir el tag al repo 
      # para que quede constancia histórica (opcional pero recomendado)
      - name: Push Version Tag to Repo
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ -f
          git commit -m "Release ${{ env.APP_VERSION }} [skip ci]" || echo "No changes to commit"
          git tag v${{ env.APP_VERSION }}
          git push origin main --tags