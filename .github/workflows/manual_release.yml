name: Manual Tag Release

on:
  push:
    tags:
      - 'v*'

jobs:
  manual-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # Aquí sí compilas para ambos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Para traer el commit que incluye el 'dist'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync version with Tag
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

      - name: Install and Compile
        run: |
          npm install
          npm run compile

      - name: Build and Publish
        run: |
          npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'linux' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}